name: daily-news

on:
  schedule:
    - cron: "0 22 * * *" # KST 07:00 매일
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python pipeline/news_fetch.py
      # data.go.kr는 해외 IP를 차단하므로 서울 리전 함수(/api/jobs)를 경유해 동기화 —
      # 정적 채용 페이지(/jobs/*)의 공고 목록·JobPosting 색인 신선도 유지용.
      - name: Sync jobs (via Seoul-region proxy)
        continue-on-error: true
        run: python pipeline/jobs_fetch.py
      - name: Commit if changed
        run: |
          git config user.name "kopower-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet web/public/data/news.json web/public/data/jobs.json; then
            git add web/public/data/news.json web/public/data/jobs.json
            git commit -m "data: 뉴스·채용공고 일일 자동 갱신 ($(date +%Y-%m-%d))"
            git push
          else
            echo "변경 없음"
          fi
